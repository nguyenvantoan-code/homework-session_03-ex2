server {
    listen 80;
    listen [::]:80;

    server_name _;

    # Thư mục gốc chứa mã nguồn trang web
    root /var/www/my-web/html;
    index index.html index.htm;

    # Cấu hình chuyển hướng lỗi 404 tới tệp 404.html tùy biến
    error_page 404 /404.html;

    # Location block phục vụ trang lỗi 404 tùy biến
    # Chỉ thị internal đảm bảo người dùng KHÔNG THỂ truy cập trực tiếp qua URL /404.html
    location = /404.html {
        root /var/www/my-web/html;
        internal;
    }

    # Cấu hình xử lý các yêu cầu truy cập thông thường
    location / {
        try_files $uri $uri/ =404;
    }
}
